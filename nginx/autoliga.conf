# /etc/nginx/sites-available/autoliga.conf
# Maqsad: barcha variantlar bitta 301 bilan https://autoliga.uz ga o'tsin.
#   http://autoliga.uz       -> https://autoliga.uz
#   http://www.autoliga.uz   -> https://autoliga.uz
#   https://www.autoliga.uz  -> https://autoliga.uz
#
# Oldin: SSL sertifikat www ni ham qamrab olishi kerak:
#   sudo certbot --nginx -d autoliga.uz -d www.autoliga.uz
# Keyin: sudo nginx -t && sudo systemctl reload nginx
#
# MOSLASH KERAK: proxy_pass manzili (gunicorn socket yoki port) va /path/to/project

# 1) HTTP (ikkala domen) -> https://autoliga.uz
server {
    listen 80;
    listen [::]:80;
    server_name autoliga.uz www.autoliga.uz;
    return 301 https://autoliga.uz$request_uri;
}

# 2) HTTPS www -> https://autoliga.uz
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.autoliga.uz;

    ssl_certificate     /etc/letsencrypt/live/autoliga.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoliga.uz/privkey.pem;

    return 301 https://autoliga.uz$request_uri;
}

# 3) Asosiy sayt
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoliga.uz;

    ssl_certificate     /etc/letsencrypt/live/autoliga.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoliga.uz/privkey.pem;

    client_max_body_size 20m;

    # Siqish
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml text/xml image/svg+xml;

    # robots.txt va sitemap.xml Django'dan keladi (core/urls_qoshimcha.py).
    # Agar ilgari bu yerda "location = /robots.txt { alias ...; }" bo'lsa, O'CHIRING.

    location /static/ {
        alias /path/to/project/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /media/ {
        alias /path/to/project/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;          # yoki unix:/run/gunicorn.sock
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
